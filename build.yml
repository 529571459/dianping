# 把这个工程传到 GitHub 之后，每次改动都会自动编译出一个 APK。
# 不用装 Android Studio，不用装 SDK，浏览器就够了。
# 编译好的文件在仓库的 Actions 页面里下载。

name: 编译 APK

on:
  push:              # 每次上传/修改代码都编译
  workflow_dispatch: # 也可以在网页上手动点一下就编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 给 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 编译
        run: ./gradlew assembleDebug --stacktrace

      # 编译好的 APK 会出现在 Actions 运行结果页面的 Artifacts 里
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: shidan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 万一编译失败，把完整日志也传上来，方便发给我看
      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
